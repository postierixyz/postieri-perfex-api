[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "postieri-perfex"
version = "0.1.0"
description = "Python client for the Postieri Perfex API"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Postieri XYZ L.L.C.", email = "office@postieri.xyz"}]
keywords = ["perfex", "crm", "api", "postieri"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage   = "https://github.com/postierixyz/postieri-perfex-api"
Repository = "https://github.com/postierixyz/postieri-perfex-api"
Issues     = "https://github.com/postierixyz/postieri-perfex-api/issues"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.1', '8.2', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring, pdo, pdo_mysql
          coverage: xdebug

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHP syntax check
        run: |
          echo "=== Syntax check on all PHP files ==="
          find modules/postieri_api -name "*.php" -not -path "*/vendor/*" -not -path "*/tests/*" \
            -exec php -l {} \; 2>&1 | grep -v "No syntax errors detected" || true

      - name: PHPUnit
        run: composer test
        continue-on-error: true  # remove when tests are written

      - name: PHPStan (static analysis)
        run: |
          vendor/bin/phpstan analyse modules/postieri_api/src \
            --level=5 \
            --no-progress \
            || true  # remove || true when codebase is finalised

      - name: PHPCS (PSR-12 check)
        run: |
          vendor/bin/phpcs --standard=PSR12 modules/postieri_api/src || true

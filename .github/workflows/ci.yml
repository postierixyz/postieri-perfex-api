name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ["8.1", "8.2", "8.3"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pdo_mysql, intl, zip, xml, curl
          coverage: none
          tools: composer, phpstan, phpcs, phpunit

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check (every module file)
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './sdk/*' -not -path './tests/*' -print0 | xargs -0 -n1 -I{} \
            php -l {}

      - name: Run PHPUnit tests
        run: composer test

      - name: Run PHPStan static analysis
        run: composer analyse

      - name: Run PHPCS code style check
        run: composer cs-check

  python:
    name: Python ${{ matrix.python }} SDK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Syntax check the SDK
        working-directory: sdk/python
        run: |
          python -m py_compile postieri_perfex/__init__.py
          python -m py_compile tests/test_client.py

      - name: Run SDK tests
        working-directory: sdk/python
        run: |
          python -m unittest tests.test_client -v

  openapi:
    name: OpenAPI spec lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate OpenAPI spec with redocly
        run: |
          npm install -g @redocly/cli@latest
          redocly lint docs/openapi.yaml

openapi: 3.1.0
info:
  title: Postieri Perfex API
  description: |
    REST API + webhooks for Perfex CRM (3.2+). Built by Postieri XYZ L.L.C.
    for internal automation, lead pipeline, and invoice management.

    - Bearer-token auth with Argon2id-hashed tokens
    - Scopes for fine-grained access (e.g. `customers:read`, `invoices:write`)
    - Standard JSON envelope: `{status, data, meta}` or `{status, error}`
    - Webhooks signed with HMAC-SHA256, with exponential-backoff retry
    - Rate limit: 100 req/min, 1000 req/hour per token (configurable)
  version: 0.1.0
  contact:
    name: Postieri XYZ L.L.C.
    url: https://postieri.xyz
    email: office@postieri.xyz
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://perfex.example.com
    description: Production (replace with your Perfex URL)
  - url: http://localhost:8080
    description: Local Docker (docker-compose.yml)

tags:
  - name: auth
    description: API token lifecycle
  - name: customers
  - name: contacts
  - name: invoices
  - name: subscriptions
  - name: leads
  - name: webhooks

security:
  - bearerAuth: []

paths:
  /api/v1/auth/token:
    post:
      tags: [auth]
      summary: Issue an API token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/TokenRequestSelf"
                - $ref: "#/components/schemas/TokenRequestAdmin"
      responses:
        "201":
          description: Token created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /api/v1/auth/tokens:
    get:
      tags: [auth]
      summary: List all tokens
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: boolean }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Token" }

  /api/v1/auth/tokens/{id}:
    delete:
      tags: [auth]
      summary: Revoke a token
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/customers:
    get:
      tags: [customers]
      summary: List customers
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PerPageQuery"
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paged list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Customer" }
    post:
      tags: [customers]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CustomerFull" }

  /api/v1/customers/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [customers]
      summary: Get a customer
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CustomerFull" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [customers]
      summary: Update a customer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CustomerFull" }
    delete:
      tags: [customers]
      summary: Delete a customer
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/invoices:
    get:
      tags: [invoices]
      summary: List invoices
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PerPageQuery"
        - name: customer_id
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: integer, enum: [1, 2, 3, 4, 5, 6] }
      responses:
        "200":
          description: Paged list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Invoice" }
    post:
      tags: [invoices]
      summary: Create an invoice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/InvoiceFull" }

  /api/v1/invoices/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [invoices]
      summary: Get an invoice
      responses:
        "200":
          description: Invoice with items and payments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/InvoiceFull" }
    put:
      tags: [invoices]
      summary: Update an invoice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/InvoiceFull" }

  /api/v1/invoices/{id}/pdf:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [invoices]
      summary: Download invoice PDF
      responses:
        "200":
          description: PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /api/v1/subscriptions:
    get:
      tags: [subscriptions]
      summary: List subscriptions
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PerPageQuery"
        - name: customer_id
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string, enum: [active, expiring, expired] }
      responses:
        "200":
          description: Paged list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Subscription" }

  /api/v1/subscriptions/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [subscriptions]
      summary: Get a subscription
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Subscription" }

  /api/v1/leads:
    get:
      tags: [leads]
      summary: List leads
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PerPageQuery"
        - name: q
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Paged list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Lead" }
    post:
      tags: [leads]
      summary: Create a lead
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Lead" }

  /api/v1/leads/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [leads]
      summary: Get a lead
      responses:
        "200":
          description: Lead
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Lead" }
    put:
      tags: [leads]
      summary: Update a lead
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadUpdate" }
      responses:
        "200":
          description: Updated
    delete:
      tags: [leads]
      summary: Delete a lead
      responses:
        "204": { description: Deleted }

  /api/v1/leads/{id}/convert:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [leads]
      summary: Convert a lead to a customer
      responses:
        "200":
          description: Converted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          lead_id: { type: integer }
                          customer_id: { type: integer }
                          status: { type: string, example: converted }

  /api/v1/webhooks:
    get:
      tags: [webhooks]
      summary: List webhooks
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Webhook" }
    post:
      tags: [webhooks]
      summary: Create a webhook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Webhook" }

  /api/v1/webhooks/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [webhooks]
      summary: Get a webhook
      responses:
        "200":
          description: Webhook
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Webhook" }
    put:
      tags: [webhooks]
      summary: Update a webhook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookUpdate" }
      responses:
        "200":
          description: Updated
    delete:
      tags: [webhooks]
      summary: Delete a webhook
      responses:
        "204": { description: Deleted }

  /api/v1/webhooks/{id}/deliveries:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [webhooks]
      summary: List delivery log for a webhook
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PerPageQuery"
      responses:
        "200":
          description: Deliveries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/WebhookDelivery" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Pass the token from /auth/token as `Authorization: Bearer <token>`"

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer }
    PageQuery:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPageQuery:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }

  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Insufficient scope or wrong role
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationFailed:
      description: Validation error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Envelope:
      type: object
      required: [status]
      properties:
        status: { type: boolean, enum: [true] }
        data: {}
        meta:
          type: object
          additionalProperties: true
    Error:
      type: object
      required: [status, error]
      properties:
        status: { type: boolean, enum: [false] }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: validation_failed }
            message: { type: string }
            details:
              type: object
              additionalProperties: true

    TokenRequestSelf:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        name: { type: string, default: API token }
    TokenRequestAdmin:
      type: object
      required: [user_id, name]
      properties:
        user_id: { type: integer }
        name: { type: string }
        scopes:
          type: array
          items: { type: string }
        expires_at: { type: [string, 'null'], format: date-time }
    TokenResponse:
      type: object
      properties:
        status: { type: boolean }
        data:
          type: object
          required: [id, token, user_id, scopes]
          properties:
            id: { type: integer }
            token: { type: string, description: "Plain token. Save now — not shown again." }
            user_id: { type: integer }
            scopes:
              type: array
              items: { type: string }
            expires_at: { type: [string, 'null'], format: date-time }
            warning: { type: string }
    Token:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        name: { type: string }
        scopes:
          type: array
          items: { type: string }
        last_used_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    Customer:
      type: object
      properties:
        id: { type: integer }
        company: { type: string }
        vat: { type: string }
        phonenumber: { type: string }
        country: { type: integer }
        city: { type: string }
        zip: { type: string }
        state: { type: string }
        address: { type: string }
        website: { type: string }
        active: { type: integer }
        datecreated: { type: string, format: date-time }
    CustomerFull:
      allOf:
        - $ref: "#/components/schemas/Customer"
        - type: object
          properties:
            billing_street: { type: string }
            billing_city: { type: string }
            billing_zip: { type: string }
            billing_state: { type: string }
            billing_country: { type: integer }
            contacts:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  firstname: { type: string }
                  lastname: { type: string }
                  email: { type: string, format: email }
                  phonenumber: { type: string }
                  is_primary: { type: integer }
    CustomerCreate:
      type: object
      required: [company, firstname, lastname, email, password]
      properties:
        company: { type: string }
        firstname: { type: string }
        lastname: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }
        phonenumber: { type: string }
        country: { type: integer }
        city: { type: string }
        zip: { type: string }
        state: { type: string }
        address: { type: string }
        website: { type: string }
        vat: { type: string }
    CustomerUpdate:
      type: object
      additionalProperties: true

    Invoice:
      type: object
      properties:
        id: { type: integer }
        number: { type: string }
        customer_id: { type: integer }
        status: { type: integer }
        status_name: { type: string }
        date: { type: string, format: date }
        due_date: { type: string, format: date }
        subtotal: { type: number }
        total_tax: { type: number }
        discount: { type: number }
        total: { type: number }
        currency: { type: string }
        symbol: { type: string }
    InvoiceFull:
      allOf:
        - $ref: "#/components/schemas/Invoice"
        - type: object
          properties:
            items:
              type: array
              items: { type: object }
            payments:
              type: array
              items: { type: object }
    InvoiceCreate:
      type: object
      required: [customer_id, date, due_date]
      properties:
        customer_id: { type: integer }
        date: { type: string, format: date }
        due_date: { type: string, format: date }
        items:
          type: array
          items:
            type: object
            properties:
              description: { type: string }
              qty: { type: number }
              rate: { type: number }
              taxrate: { type: array, items: { type: string } }
        currency: { type: integer }
        notes: { type: string }
    InvoiceUpdate:
      type: object
      additionalProperties: true

    Subscription:
      type: object
      properties:
        id: { type: integer }
        customer_id: { type: [integer, 'null'] }
        name: { type: string }
        description: { type: string }
        starts_at: { type: string, format: date }
        ends_at: { type: string, format: date }
        stripe_subscription_id: { type: [string, 'null'] }
        customer_company: { type: [string, 'null'] }
        days_until_renewal: { type: integer }
        is_active: { type: boolean }
        is_expiring: { type: boolean }
        is_expired: { type: boolean }

    Lead:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        company: { type: [string, 'null'] }
        phonenumber: { type: [string, 'null'] }
        title: { type: [string, 'null'] }
        country: { type: integer }
        status: { type: string }
        source: { type: string }
        assigned: { type: integer }
        dateadded: { type: string, format: date-time }
        is_lead: { type: integer }
    LeadCreate:
      type: object
      required: [name, email]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        company: { type: string }
        phonenumber: { type: string }
        title: { type: string }
        country: { type: integer }
        source: { type: string }
        description: { type: string }
    LeadUpdate:
      type: object
      additionalProperties: true

    Webhook:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        url: { type: string, format: uri }
        events:
          type: array
          items: { type: string }
        secret: { type: string, description: "HMAC-SHA256 signing key (shown on create/update only)" }
        is_active: { type: integer }
        created_by: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WebhookCreate:
      type: object
      required: [name, url, events]
      properties:
        name: { type: string }
        url: { type: string, format: uri }
        events:
          type: array
          items:
            type: string
            enum:
              - invoice.created
              - invoice.paid
              - subscription.expiring
              - subscription.expired
              - lead.created
              - lead.converted
              - lead.lost
              - "*"
        secret: { type: string }
        is_active: { type: boolean, default: true }
    WebhookUpdate:
      type: object
      additionalProperties: true
    WebhookDelivery:
      type: object
      properties:
        id: { type: integer }
        webhook_id: { type: integer }
        event: { type: string }
        payload: { type: string }
        response_status: { type: [integer, 'null'] }
        response_body: { type: [string, 'null'] }
        attempt: { type: integer }
        delivered_at: { type: [string, 'null'], format: date-time }
        next_retry_at: { type: [string, 'null'], format: date-time }
        failed_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

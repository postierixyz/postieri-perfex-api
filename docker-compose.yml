# Postieri Perfex API — Coolify-ready
#
# Two deployment options:
#
#   1. SIMPLE — Coolify "Docker Image" service
#      Image: ghcr.io/postierixyz/postieri-perfex-api:3.4.1
#      Add a MySQL database via Coolify's "Database" service
#      Set env vars (see COOLIFY-SETUP.md)
#
#   2. SELF-CONTAINED — Coolify "Docker Compose" service
#      Paste this file. Both app + MySQL in one stack.
#
# ─────────────────────────────────────────────────────────────
# If you use option 1 (separate MySQL), delete the `db:` service
# and the `dbdata` volume, and set DB_HOSTNAME=your-mysql-host.
# ─────────────────────────────────────────────────────────────

services:
  perfex:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ghcr.io/postierixyz/postieri-perfex-api:3.4.1
    container_name: postieri-perfex-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # ── Perfex base URL ─────────────────────────────────
      # Coolify will set SERVICE_URL_PERFEX if you map a domain
      APP_URL: ${SERVICE_URL_PERFEX:-http://localhost:8080}
      # ── DB connection (point at your MySQL) ─────────────
      DB_HOSTNAME: ${DB_HOSTNAME:-db}
      DB_PORT: "3306"
      DB_USERNAME: ${DB_USERNAME:-perfex}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in Coolify}
      DB_NAME: ${DB_NAME:-perfex}
      # ── Cron ────────────────────────────────────────────
      CRON_ENABLED: "true"
    volumes:
      - perfex_uploads:/var/www/html/uploads
      - perfex_app:/var/www/html/application/config
    # ── No ports exposed ────────────────────────────────
    # Coolify routes via Traefik based on the domain you set.
    # If you need to debug, add "ports: ['8080:80']" temporarily.

  db:
    image: mysql:8.0
    container_name: postieri-perfex-db
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in Coolify}
      MYSQL_DATABASE: ${DB_NAME:-perfex}
      MYSQL_USER: ${DB_USERNAME:-perfex}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in Coolify}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  perfex_uploads:
  perfex_app:
  dbdata:
